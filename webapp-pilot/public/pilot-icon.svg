<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFBF8"/>
      <stop offset="100%" stop-color="#E7E3D9"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222834"/>
      <stop offset="100%" stop-color="#13171F"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="brow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Molded ceramic outer tile -->
  <rect width="512" height="512" rx="112" fill="url(#chassis)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#D5D0C3" stroke-width="6"/>
  <!-- Top LEGO stud accents -->
  <rect x="144" y="64" width="84" height="32" rx="12" fill="#E0DBD0" stroke="#C9C3B4" stroke-width="4"/>
  <rect x="284" y="64" width="84" height="32" rx="12" fill="#E0DBD0" stroke="#C9C3B4" stroke-width="4"/>
  <!-- Robot head housing -->
  <rect x="74" y="96" width="364" height="248" rx="64" fill="#FFFFFF" stroke="#D1CBC0" stroke-width="8"/>
  <!-- Recessed dark visor -->
  <rect x="102" y="132" width="308" height="176" rx="44" fill="url(#visor)"/>
  <!-- Left & right binocular eyes -->
  <circle cx="192" cy="228" r="50" fill="#0F141C" stroke="#0EA5E9" stroke-width="10"/>
  <circle cx="320" cy="228" r="50" fill="#0F141C" stroke="#0EA5E9" stroke-width="10"/>
  <circle cx="192" cy="228" r="24" fill="url(#eyeGlow)"/>
  <circle cx="320" cy="228" r="24" fill="url(#eyeGlow)"/>
  <circle cx="183" cy="218" r="7" fill="#E0F2FE"/>
  <circle cx="311" cy="218" r="7" fill="#E0F2FE"/>
  <!-- Iconic Vernie expressive orange eyebrows -->
  <path d="M128 164 L232 180" stroke="url(#brow)" stroke-width="22" stroke-linecap="round"/>
  <path d="M384 164 L280 180" stroke="url(#brow)" stroke-width="22" stroke-linecap="round"/>
  <!-- LEGO green Move Hub power button bar -->
  <rect x="176" y="384" width="160" height="44" rx="22" fill="#16A34A"/>
  <rect x="184" y="390" width="144" height="12" rx="6" fill="#4ADE80" opacity="0.5"/>
</svg>
